<style>
/* Layout: one phone-width column of cards, a fixed four-tab bar, and a full-screen workout mode. */
:root{--bg:#F2F4F3;--card:#FFFFFF;--ink:#13201B;--mut:#56635E;--line:#DDE3E0;--soft:#E3E8E5;--acc:#1F3FE0;--acc-ink:#FFFFFF;--acc-soft:#E6EAFE;--acc-text:#162DA8;--good:#1B7A4B;--bad:#B4321F;--rec:#9A4A06;--hdr:#13201B;--hdr-ink:#FFFFFF;--hdr-mut:#C9D3CE;--hdr-line:#56635E;
--body:Barlow,system-ui,-apple-system,sans-serif;--num:'Barlow Condensed',Barlow,system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1513;--card:#18221E;--ink:#EEF2F0;--mut:#9DAAA4;--line:#2A3632;--soft:#24302B;--acc:#8196FF;--acc-ink:#0B1230;--acc-soft:#1C2550;--acc-text:#BCC7FF;--good:#5FCB92;--bad:#FF8A75;--rec:#F0A552;--hdr:#18221E;--hdr-ink:#EEF2F0;--hdr-mut:#9DAAA4;--hdr-line:#56635E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1513;--card:#18221E;--ink:#EEF2F0;--mut:#9DAAA4;--line:#2A3632;--soft:#24302B;--acc:#8196FF;--acc-ink:#0B1230;--acc-soft:#1C2550;--acc-text:#BCC7FF;--good:#5FCB92;--bad:#FF8A75;--rec:#F0A552;--hdr:#18221E;--hdr-ink:#EEF2F0;--hdr-mut:#9DAAA4;--hdr-line:#56635E;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
#app.work{padding-block:0 32px;gap:14px}
h1{margin:0;font-family:var(--num);font-weight:700;font-size:38px;line-height:1.05;text-wrap:balance}
h2{margin:0;font-size:13px;font-weight:600;color:var(--mut)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.num{font-family:var(--num);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row>*{min-width:0}
.list>*{padding:11px 0;border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:600;font-size:15px}
.btn.pri{border:0;background:var(--acc);color:var(--acc-ink)}
.btn.big{min-height:54px;font-size:17px;border-radius:12px;width:100%}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45}
.link{background:none;border:0;padding:12px 0;color:var(--acc-text);font-weight:600;font-size:15px;text-align:left}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:500;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:13px;font-weight:600}
.week div{padding:9px 0;border-radius:10px;border:2px solid transparent;background:var(--soft);color:var(--mut)}
.week .done{background:var(--ink);color:var(--bg)}
.week .now{border-color:var(--acc)}
.tip{background:var(--acc-soft);border-radius:12px;padding:12px 14px}
.tip b{color:var(--acc-text);display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px}
.sets{display:grid;grid-template-columns:40px 1fr 1fr 28px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sets.head{border-top:0;padding:4px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.step{background:var(--card);border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.step button{width:46px;height:46px;flex:none;border:0;border-radius:9px;background:var(--soft);font-weight:600;font-size:22px}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--num);font-weight:700;font-size:28px;padding:0}
.step label{display:block;text-align:center;font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-weight:500;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok{border-color:var(--good);color:var(--good)}
.hdr{background:var(--hdr);color:var(--hdr-ink);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.hdr .ghost{min-height:44px;padding:0 14px;border:1px solid var(--hdr-line);border-radius:10px;background:transparent;color:var(--hdr-ink);font-weight:600;font-size:14px}
.hdr .bar{height:6px;border-radius:3px;background:var(--hdr-line)}
.hdr .bar div{height:6px;border-radius:3px;background:var(--acc-soft)}
.field{min-height:44px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
.video{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:170px;border-radius:16px;background:var(--hdr);color:var(--hdr-ink);text-decoration:none;font-weight:600;text-align:center;padding:16px}
.frame{aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:var(--hdr)}
.frame iframe{width:100%;height:100%;border:0;display:block}
.video span{font-size:13px;font-weight:400;color:var(--hdr-mut)}
.cue{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.meter{height:10px;border-radius:5px;background:var(--soft)}
.meter div{height:10px;border-radius:5px;background:var(--ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#tabs button{min-height:60px;border:0;background:none;font-size:13px;font-weight:600;color:var(--mut)}
#tabs button.on{color:var(--acc-text)}
#sheet{position:fixed;inset:0;z-index:20;overflow:auto;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet>div{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
svg text{font-family:var(--body);font-size:11px;fill:var(--mut)}
textarea.field{min-height:88px;resize:vertical}
</style>
</head>

<script>

E('back_squat','Barbell back squat','Legs','squat','bb','aOzrA4FgnM0',8,10,120,'Set the bar at upper-chest height. Rest it across your upper back, not your neck. Feet shoulder-width, toes slightly out.','Brace your stomach, sit down and back until your thighs are about level with the floor, then drive up through your whole foot.','Knees caving inward, heels lifting, or rounding your lower back at the bottom. Set the safety bars just below your lowest point.');
E('leg_press','Leg press','Legs','squat','mc','K5n2vg3oZa4',8,12,120,'Set the seat so your knees bend to about 90 degrees at the bottom. Feet shoulder-width in the middle of the plate.','Lower under control until your knees are well bent, then press through your heels and mid-foot.','Snapping your knees locked at the top, or going so deep that your hips roll off the seat.');
E('goblet_squat','Goblet squat','Legs','squat','db','CkFzgR55gho',8,12,90,'Hold one dumbbell upright against your chest with both hands, elbows tucked in.','Sit straight down between your knees with your chest up, then stand tall.','Letting the dumbbell drift away from your chest, or your heels lifting.');
E('split_squat','Bulgarian split squat','Legs','squat','db','SkNsa3eBwLA',8,12,90,'Stand a long step in front of a bench and rest the top of your back foot on it. Dumbbells at your sides.','Drop your back knee toward the floor with most of your weight on the front foot, then push up. Do all reps on one leg, then the other.','Standing too close to the bench, or letting the front knee collapse inward.');
E('reverse_lunge','Dumbbell reverse lunge','Legs','squat','db','RZKXLMxPF_I',8,12,90,'Stand tall with a dumbbell in each hand.','Step one foot back and lower until both knees are at about 90 degrees, then push through the front foot to stand. Do all reps on one leg, then the other.','Very short steps, or leaning your chest far forward.');
E('leg_ext','Leg extension','Legs','squat','mc','YyvSfVjQeL0',10,15,60,'Line your knees up with the machine pivot. Pad on your lower shins, back against the seat.','Straighten your legs, squeeze for a second, and lower slowly.','Kicking the weight up with momentum or lifting off the seat.');
E('rdl','Romanian deadlift','Legs','hinge','bb','3VXmecChYYM',8,10,120,'Stand holding the bar at your thighs, feet hip-width, knees slightly bent.','Push your hips back and slide the bar down your legs until you feel a strong hamstring stretch, usually just below the knee. Squeeze your glutes to stand.','Rounding your back, or bending your knees more and turning it into a squat.');
E('db_rdl','Dumbbell Romanian deadlift','Legs','hinge','db','hQgFixeXdZo',8,12,90,'Stand with a dumbbell in each hand in front of your thighs, feet hip-width, knees slightly bent.','Push your hips back and lower the dumbbells close to your legs until you feel a strong hamstring stretch. Squeeze your glutes to stand.','Rounding your back or letting the dumbbells swing away from your legs.');
E('leg_curl','Seated leg curl','Legs','hinge','mc','oFxEDkppbSQ',10,15,60,'Line your knees up with the machine pivot. Lower pad just above your heels, thigh pad snug.','Curl your heels under the seat, pause, and return slowly.','Lifting your hips or letting the weight snap back.');
E('hip_thrust','Barbell hip thrust','Legs','hinge','bb','Zp26q4BY5HE',8,12,120,'Sit with your shoulder blades against a bench and a padded bar over your hips. Feet flat, hip-width.','Drive your hips up until your body is level from shoulders to knees, squeeze your glutes, and lower under control.','Arching your lower back at the top. Keep your chin tucked and ribs down.');
E('db_hip_thrust','Dumbbell hip thrust','Legs','hinge','db','29OfN4ztW_g',10,15,90,'Sit with your shoulder blades against a bench and hold one dumbbell on your hips. Feet flat, hip-width.','Drive your hips up until your body is level from shoulders to knees, squeeze your glutes, and lower under control.','Arching your lower back at the top. Keep your chin tucked and ribs down.');
E('calf_raise','Standing calf raise','Legs','calf','mc','SVtg-1loH4c',10,15,60,'Balls of your feet on the edge of the platform, shoulders under the pads.','Lower your heels for a full stretch, pause, then rise as high as you can.','Bouncing through short, fast reps.');
E('db_calf_raise','Dumbbell calf raise','Legs','calf','db','wxwY7GXxL4k',10,15,60,'Stand on the edge of a step holding a dumbbell, with your free hand on something for balance.','Lower your heels for a full stretch, pause, then rise as high as you can.','Bouncing through short, fast reps.');
E('bench','Barbell bench press','Chest','hpush','bb','lWFknlOTbyM',8,10,120,'Lie with your eyes under the bar and feet flat. Grip slightly wider than your shoulders and pull your shoulder blades together.','Lower the bar to your mid-chest with your elbows about 45 degrees from your body, then press up.','Bouncing the bar off your chest or flaring your elbows straight out. Use a spotter or safety bars as it gets heavy.');
E('db_bench','Dumbbell bench press','Chest','hpush','db','VmB1G1K7v94',8,12,90,'Sit with the dumbbells on your thighs, lie back and bring them to chest level. Feet flat.','Press up until your arms are straight, then lower until the dumbbells are level with your chest.','Flaring your elbows straight out to the sides, or lowering too fast.');
E('chest_press','Chest press machine','Chest','hpush','mc','P8Hx90LdGH4',8,12,90,'Set the seat so the handles line up with your mid-chest. Shoulder blades back against the pad.','Press out until your arms are nearly straight and return slowly.','Shoulders rolling forward or shrugging up.');
E('incline_db','Incline dumbbell press','Chest','hpush','db','IP4oeKh1Sd4',8,12,90,'Set the bench to about 30 degrees. Dumbbells at chest level.','Press up over your shoulders, then lower until the dumbbells reach upper-chest level.','A bench set too steep, which turns it into a shoulder press.');
E('pushup','Push-up','Chest','hpush','bw','IODxDxX7oi4',8,15,60,'Hands slightly wider than your shoulders, body in a straight line from head to heels.','Lower your chest to just above the floor with elbows about 45 degrees out, then push up.','Sagging hips or half reps. Put your hands on a bench to make it easier.');
E('pec_deck','Pec deck fly','Chest','hpush','mc','H4mVGHaK2f4',10,15,60,'Set the seat so the handles are at chest height. Keep a slight bend in your elbows.','Bring your hands together in a wide arc, squeeze, and open slowly until you feel a chest stretch.','Letting the handles pull your shoulders too far back.');
E('db_fly','Dumbbell fly','Chest','hpush','db','eozdVDA78K0',10,15,60,'Lie on a bench with the dumbbells above your chest, palms facing each other, elbows slightly bent.','Open your arms in a wide arc until you feel a chest stretch, then bring them back together.','Going heavy or lowering below shoulder level. Keep this one light.');
E('ohp','Barbell overhead press','Shoulders','vpush','bb','KP1sYz2VICk',8,10,120,'Bar on your upper chest, grip just outside your shoulders, feet hip-width, glutes and stomach tight.','Press straight up, moving your head back and then through, until your arms are locked over your shoulders.','Leaning back and arching your lower back.');
E('db_shoulder','Dumbbell shoulder press','Shoulders','vpush','db','rO_iEImwHyo',8,12,90,'Sit on a bench with back support, dumbbells at ear level, forearms upright.','Press overhead until your arms are straight, then lower to ear level.','Arching your back off the pad.');
E('shoulder_machine','Shoulder press machine','Shoulders','vpush','mc','3R14MnZbcpw',8,12,90,'Set the seat so the handles start level with your ears. Back against the pad.','Press up until your arms are nearly straight and lower slowly.','Shrugging your shoulders toward your ears.');
E('lateral','Lateral raise','Shoulders','vpush','db','PzsMitRdI_8',10,15,60,'Stand with light dumbbells at your sides and a slight bend in your elbows.','Raise your arms out to the sides to shoulder height, leading with your elbows, and lower slowly.','Swinging your body or going heavy. Light and controlled works best.');
E('pulldown','Lat pulldown','Back','vpull','cb','',10,12,90,'Sit tall with the thigh pad snug. Grip the bar a little wider than your shoulders.','Lift your chest and pull the bar to your upper chest, driving your elbows down toward your hips. Let the bar rise slowly until your arms are straight.','Swinging your body back to move the weight, or pulling the bar behind your neck.');
E('pullover','Dumbbell pullover','Back','vpull','db','Cvsaj2AXevI',10,15,60,'Lie on a bench holding one dumbbell with both hands above your chest, elbows slightly bent.','Lower the dumbbell back behind your head until you feel a stretch down your sides, then pull it back over your chest.','Bending your elbows more as you lower, or using more weight than you can control.');
E('cable_row','Seated cable row','Back','hpull','cb','vwHG9Jfu4sw',8,12,90,'Feet on the platform, knees slightly bent, sitting tall with the handle in both hands.','Pull the handle to your lower ribs, squeezing your shoulder blades together, then let your arms reach fully forward.','Rocking your body back and forth to move the weight.');
E('db_row','One-arm dumbbell row','Back','hpull','db','dFzUjzfih7k',8,12,90,'One hand and the same-side knee on a bench, back flat, dumbbell hanging from the other arm.','Pull the dumbbell toward your hip with your elbow close to your side, then lower to a full stretch. Do all reps on one arm, then the other.','Twisting your body or yanking with your shoulder.');
E('chest_row','Chest-supported dumbbell row','Back','hpull','db','tvk5Fb2K0Ns',8,12,90,'Set a bench to about 30 to 45 degrees and lie chest-down on it with a dumbbell in each hand.','Row both dumbbells toward your hips, squeeze your shoulder blades, and lower fully.','Lifting your chest off the bench.');
E('bb_row','Barbell row','Back','hpull','bb','FWJR5Ve8bnQ',8,10,120,'Feet hip-width. Hinge forward until your body is at about 45 degrees with a flat back, bar hanging at arm\'s length.','Pull the bar to your lower ribs and lower it under control.','Standing up with each rep or rounding your back.');
E('face_pull','Face pull','Shoulders','rear','cb','rep-qVOkqgk',12,15,60,'Rope attachment at about face height. Hold the rope with your thumbs toward you and step back.','Pull the rope toward your face, spreading your hands apart and keeping your elbows high. Pause and return slowly.','Too much weight, which turns it into a row.');
E('rear_fly','Dumbbell rear delt fly','Shoulders','rear','db','buuYPLVXsJg',12,15,60,'Hinge forward with a flat back, or lie chest-down on an incline bench, with light dumbbells hanging.','Raise your arms out to the sides until they are level with your shoulders, then lower slowly.','Swinging or shrugging.');
E('reverse_pec','Reverse pec deck','Shoulders','rear','mc','dC7jhEk-29A',12,15,60,'Face the pad with the handles at shoulder height and your arms nearly straight.','Sweep your arms out and back until they are in line with your shoulders, then return slowly.','Shrugging your shoulders up as you pull.');
E('pushdown','Triceps pushdown','Arms','tri','cb','-zLyUAo1gMw',10,15,60,'Rope or bar on a high pulley. Elbows pinned to your sides, leaning slightly forward.','Push down until your arms are straight, then return until your forearms are just above level.','Elbows drifting forward, or leaning your body weight onto the bar.');
E('db_tri_ext','Overhead triceps extension','Arms','tri','db','-Vyt2QdsR7E',10,15,60,'Sit or stand holding one dumbbell overhead with both hands.','Lower it behind your head by bending your elbows, then straighten your arms.','Elbows flaring wide or arching your lower back.');
E('bb_curl','Barbell curl','Arms','bi','bb','QZEqB6wUPxQ',8,12,60,'Stand holding the bar at shoulder-width, palms up, elbows by your sides.','Curl to shoulder height without your elbows moving forward, and lower slowly.','Swinging your hips to start the rep.');
E('db_curl','Dumbbell curl','Arms','bi','db','ykJmrZ5v0Oo',10,12,60,'Stand with a dumbbell in each hand, palms forward, elbows by your sides.','Curl to shoulder height without your elbows moving forward, and lower slowly.','Swinging your body to start the rep.');
E('hammer','Hammer curl','Arms','bi','db','BRVDS6HVR9Q',10,12,60,'Stand with a dumbbell in each hand, palms facing each other.','Curl to shoulder height keeping your palms facing in, and lower slowly.','Elbows drifting forward or swinging.');
E('plank','Plank','Core','core','bw','pSHjTRCQxIw',30,60,60,'Forearms on the floor, elbows under your shoulders, legs straight.','Hold a straight line from head to heels, squeezing your glutes and stomach. Keep breathing.','Hips sagging or lifting high. End the hold when your form goes.',true);
E('cable_crunch','Cable crunch','Core','core','cb','3qjoXDTuyOE',10,15,60,'Kneel facing a high pulley with the rope held beside your head.','Curl your ribs toward your hips, rounding your back, then return slowly.','Sitting back onto your heels or pulling with your arms.');
E('leg_raise','Lying leg raise','Core','core','bw','3oIpxsn6FxQ',8,15,60,'Lie on your back with your hands by your sides and your lower back pressed down.','Raise straight legs until they are vertical, then lower slowly, stopping before your back arches.','Your lower back lifting off the floor. Bend your knees to make it easier.');
E('dead_bug','Dead bug','Core','core','bw','GbSC02oU3To',8,12,60,'Lie on your back with your arms straight up and your knees bent at 90 degrees above your hips.','Lower the opposite arm and leg toward the floor, return, and switch. Count each side.','Your lower back arching off the floor.');

const MUSCLES = ['Legs','Back','Chest','Shoulders','Arms','Core'];
const MODES = [['gym','Full gym'],['mc','Machines'],['home','Home']];
const MODE_HELP = { gym:'Barbells, machines, cables and dumbbells', mc:'Machines, cables and dumbbells, no barbells', home:'Dumbbells and a bench' };
const CAN = { gym:['bb','db','mc','cb','bw'], mc:['db','mc','cb','bw'], home:['db','bw'] };
const EQ_NAME = { bb:'barbell', db:'dumbbells', mc:'machine', cb:'cable machine', bw:'bodyweight' };
/* Each slot lists the exercise for [full gym, machines, home]. */
const SLOTS = {
  squat:['back_squat','leg_press','goblet_squat'], hinge:['rdl','db_rdl','db_rdl'], quad:['leg_ext','leg_ext','split_squat'],
  ham:['leg_curl','leg_curl','db_hip_thrust'], lunge:['reverse_lunge','reverse_lunge','reverse_lunge'], glute:['hip_thrust','db_hip_thrust','db_hip_thrust'],

async function flush() {

  if (rm && (rm.upd || 0) > S.upd) { const n = norm(rm); S.settings = n.settings; S.body = n.body; S.notes = n.notes; S.upd = n.upd; }
  else if (S.upd > ((rm && rm.upd) || 0)) sync.dirty.add('meta');

    if (!k.startsWith('log-')) return;

}

    const row = { d:dk(new Date()), w:val('b-w'), waist:val('b-waist'), chest:val('b-chest'), arm:val('b-arm') };
    S.body = S.body.filter(b => b.d !== row.d);
    if (row.w != null || row.waist != null || row.chest != null || row.arm != null) S.body.push(row);
    save(['meta']);
  },
  sound() { S.settings.sound = !S.settings.sound; save(['meta']); },
  copy() {
    ui.backup = JSON.stringify({ app:'gym-progress', v:1, settings:S.settings, sessions:S.sessions, body:S.body, notes:S.notes });
    ui.msg = 'Select all of this text and copy it somewhere safe';
    try { navigator.clipboard.writeText(ui.backup).then(() => { ui.msg = 'Copied. Paste it into Notes or an email to yourself'; render(); }).catch(() => {}); } catch (e) {}
    return 'keepmsg';
  },
  restore() {
    let j = null; try { j = JSON.parse(($('#backup-in') || {}).value || ''); } catch (e) {}
    if (!j || !Array.isArray(j.sessions) || !j.sessions.every(s => s && s.id && s.d && Array.isArray(s.items))) { ui.err = 'That does not look like a Lift Log backup. Paste the whole backup text and try again.'; ui.confirm = null; return 'keeperr'; }
    if (ui.confirm !== 'restore') { ui.confirm = 'restore'; ui.keepIn = ($('#backup-in') || {}).value; return true; }
    const oldMonths = S.sessions.map(mkey), keep = new Set(j.sessions.map(s => s.id));
    const gone = S.sessions.filter(s => !keep.has(s.id)).map(s => s.id);
    const n = norm(j); n.deleted = S.deleted.filter(id => !keep.has(id)).concat(gone);
    S = n; sortSessions(); ui.confirm = null;
    save(['meta'].concat(oldMonths, S.sessions.map(mkey)));
    ui.msg = ''; ui.backup = '';
  }
};
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  readDraft();
  ui.err = '';
  const r = ACT[a] ? ACT[a](a === 'wstep' || a === 'rstep' ? +v : v) : null;
  if (r !== true) ui.confirm = null;
  if (r !== 'keepmsg') ui.msg = '';
  if (a !== 'copy') ui.backup = '';
  render();
  if (ui.keepIn != null && $('#backup-in')) { $('#backup-in').value = ui.keepIn; }
  if (ui.confirm !== 'restore') ui.keepIn = null;
  if (a === 'copy' && $('#backup-out')) { try { $('#backup-out').select(); } catch (e) {} }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'in-w' || t.id === 'in-r') { readDraft(); saveA(); }
  else if (t.id === 'q') { ui.q = t.value; $('#exlist').innerHTML = exList(); }
  else if (t.id === 'note' && A) { A.note = t.value; saveA(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'lift') { ui.lift = t.value; render(); }
  else if (t.id === 'set-theme') { S.settings.theme = t.value; applyTheme(); save(['meta']); }
  else if (t.id === 'set-prog') { S.settings.prog = t.value; save(['meta']); render(); }
  else if (t.id === 'set-unit') { S.settings.unit = t.value; S.settings.bar = t.value === 'kg' ? 20 : 45; save(['meta']); render(); }
  else if (t.id === 'set-bar') { const v = parseFloat(t.value.replace(',', '.')); if (isFinite(v) && v >= 0) { S.settings.bar = v; save(['meta']); } }
  else if (t.id === 'mynote') { const id = t.dataset.ex, v = t.value.trim().slice(0, 120); if (v) S.notes[id] = v; else delete S.notes[id]; save(['meta']); }
});
function tick() {
  if (!A || A.fin) return;
  const c = $('#clock'); if (c) c.textContent = mmss((Date.now() - A.start) / 1000);
  if (!A.restEnd) return;
  const left = A.restEnd - Date.now();
  if (left <= 0) { A.restEnd = 0; saveA(); if (!A.beeped) { A.beeped = true; beep(); } readDraft(); const f = document.activeElement && document.activeElement.id; render(); if (f && $('#' + f)) $('#' + f).focus(); return; }
  const r = $('#rest'), bar = $('#restbar');
  if (r) r.textContent = mmss(Math.ceil(left / 1000));
  if (bar && A.restLen) bar.style.width = Math.max(0, Math.min(100, (1 - left / A.restLen) * 100)) + '%';
}
setInterval(tick, 500);
document.addEventListener('visibilitychange', () => { keepAwake(); tick(); });
sortSessions();
applyTheme();
render();
initSync();
